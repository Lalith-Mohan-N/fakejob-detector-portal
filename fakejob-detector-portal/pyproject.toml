[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fakejob-detector-portal"
version = "1.0.0"
description = "Real-Time Global Job Vacancy Portal with Intelligent Fake Job Detection"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.2",
    "uvicorn[standard]>=0.27.1",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.3",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.3",
    "imbalanced-learn>=0.12.0",
    "shap>=0.44.1",
    "beautifulsoup4>=4.12.3",
    "requests>=2.31.0",
    "joblib>=1.3.2",
    "pytest>=8.0.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
